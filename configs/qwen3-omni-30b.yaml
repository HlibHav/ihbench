backend: hf
# ~30 GB from the Hub on every container start. The HF model ID would
model: Qwen/Qwen3-Omni-30B-A3B-Instruct
torch_dtype: bfloat16
device_map: auto
temperature: 1.0
max_new_tokens: 4096

# Parallelism layout for the SLURM launcher.
#   gpus_per_replica: how many GPUs one model copy needs to fit. The
#     launcher then runs N_GPUS / gpus_per_replica data-parallel replicas
#     in parallel, each pinned to its own contiguous GPU group via
#     CUDA_VISIBLE_DEVICES. Each replica uses device_map="auto" to spread
#     its assigned GPUs.
#   For Qwen3-Omni-30B in bf16 (~60 GB) on A100-40GB:
#     gpus_per_replica=2 -> 4 replicas on an 8-GPU node, each model copy
#     occupies 2 GPUs (~30 GB each). 4x throughput vs single-process
#     model-parallel.
# For models that fit on one GPU, set gpus_per_replica: 1.
gpus_per_replica: 2

# Pip packages to install into the shared venv before launching inference.
# The SLURM wrapper calls `pip install -U <each>` from this list. Use a
# pinned git SHA rather than @main so reruns are reproducible.
dependencies:
  - "transformers @ git+https://github.com/huggingface/transformers"  # Qwen3OmniMoe* lives on main; not in any tagged release yet
  - "qwen_omni_utils"
  # transformers@main's Voxtral integration imports
  # mistral_common.protocol.instruct.request.ReasoningEffort, which only
  # exists in mistral_common >= 1.8.5. Without this pin, importing the
  # transformers package fails at registry-walk time and the error surfaces
  # as a confusing 'NoneType has no attribute apply_chat_template' in the
  # downstream Qwen3-Omni client.
  - "mistral_common>=1.8.5"
