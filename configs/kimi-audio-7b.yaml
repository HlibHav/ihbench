backend: hf
# Cluster-local snapshot; avoids ~25 GB Hub download per container start.
model: moonshotai/Kimi-Audio-7B-Instruct
torch_dtype: bfloat16
device_map: auto
temperature: 1.0
max_new_tokens: 4096

# 7B LM in bf16 (~14 GB) + audio encoder fits on a single A100-40GB.
# We disable the audio detokenizer at load time (text-only output), which
# also keeps memory comfortable. 8-way data parallel on an 8-GPU node.
gpus_per_replica: 1

# Kimi-Audio is pip-installable from GitHub (pyproject.toml exists).
# The git URL drags in the kimia_infer package + its torch-side audio
# encoders. soundfile/librosa are pulled in transitively.
dependencies:
  - "git+https://github.com/MoonshotAI/Kimi-Audio.git"
  # Pin transformers to 4.48.2 (the same version Phi-4 uses). Newer
  # transformers (>= ~4.50) tightened from_pretrained() to call
  # metadata.get("format") without a None-check on the safetensors
  # metadata. Kimi's bundled whisper-large-v3 sub-checkpoint
  # (whisper-large-v3/model.safetensors) was saved WITHOUT metadata, so
  # the call crashes with "AttributeError: 'NoneType' object has no
  # attribute 'get'". 4.48.2 still accepts metadata=None.
  # (Smoke happens to pass because of cache-hit timing; the 8-rank SLURM
  # job always hits the cold-load path.)
  - "transformers==4.48.2"
